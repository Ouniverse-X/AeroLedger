name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || sdkmanager 'platforms/android-35' 'build-tools/35.0.0'
      - name: Business rules
        run: ./scripts/test-core.sh
      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:assembleDemo :app:assembleDebugAndroidTest :app:lintDebug --max-workers=4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: development-build-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
          retention-days: 14
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || sdkmanager 'platforms/android-35' 'build-tools/35.0.0'
      - name: Build device tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=4
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            ANDROID_SERIAL=emulator-5554 ./scripts/test-device.sh
            ANDROID_SERIAL=emulator-5554 python3 scripts/test-lifecycle.py --allow-test-device
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: device-evidence-api-${{ matrix.api }}
          path: artifacts/tests/
          retention-days: 14
