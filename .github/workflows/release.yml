name: Signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AEROLEDGER_STORE_FILE: signing/release.jks
      AEROLEDGER_STORE_PASSWORD: ${{ secrets.AEROLEDGER_STORE_PASSWORD }}
      AEROLEDGER_KEY_ALIAS: ${{ secrets.AEROLEDGER_KEY_ALIAS }}
      AEROLEDGER_KEY_PASSWORD: ${{ secrets.AEROLEDGER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || sdkmanager 'platforms/android-35' 'build-tools/35.0.0'
      - name: Restore release identity
        env:
          KEYSTORE_BASE64: ${{ secrets.AEROLEDGER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure all AEROLEDGER signing secrets before publishing.'; exit 1; }
          umask 077
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/release.jks
      - name: Verify tag matches app version
        run: |
          python3 - <<'PYCODE'
          import os,re,pathlib
          version=re.search(r"versionName '([^']+)'",pathlib.Path('app/build.gradle').read_text()).group(1)
          assert os.environ['GITHUB_REF_NAME']=='v'+version, 'Tag must match versionName'
          PYCODE
      - name: Check and build release
        run: |
          ./scripts/test-core.sh
          ./gradlew :app:lintRelease :app:assembleRelease --max-workers=4
      - name: Publish signed APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AeroLedger-${GITHUB_REF_NAME}-stable.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "AeroLedger $GITHUB_REF_NAME" --generate-notes ./*
      - name: Remove signing files
        if: always()
        run: python3 -c 'import shutil; shutil.rmtree("signing", ignore_errors=True)'
